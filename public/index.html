<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <section>
      <h2>Add expense</h2>
      <form id="expense-form" data-testid="expense-form">
        <label>Date <input name="date" type="date" required data-testid="input-date" /></label>
        <label>Amount <input name="amount" type="number" step="0.01" min="0.01" required data-testid="input-amount" /></label>
        <label>Category <input name="category" list="categories" required data-testid="input-category" /></label>
        <label>Note <input name="note" data-testid="input-note" /></label>
        <button type="submit" data-testid="submit">Add</button>
        <p id="form-error" class="error" data-testid="form-error" hidden></p>
      </form>
      <ul id="budget-notice" data-testid="budget-notice" hidden></ul>
      <datalist id="categories">
        <option value="food"></option>
        <option value="transport"></option>
        <option value="bills"></option>
        <option value="fun"></option>
      </datalist>
    </section>

    <section>
      <h2>Expenses</h2>
      <label>Filter category
        <input id="filter-category" list="categories" placeholder="all" data-testid="filter-category" />
      </label>
      <label>Search note
        <input id="search-note" type="search" placeholder="e.g. coffee" data-testid="search-note" />
      </label>
      <table data-testid="expense-table">
        <thead>
          <tr><th>Date</th><th>Amount</th><th>Category</th><th>Note</th><th></th></tr>
        </thead>
        <tbody id="expense-rows"></tbody>
      </table>
      <nav class="pager">
        <button id="page-prev" data-testid="page-prev">Prev</button>
        <span id="page-info" data-testid="page-info"></span>
        <button id="page-next" data-testid="page-next">Next</button>
      </nav>
    </section>

    <section>
      <h2>Monthly summary</h2>
      <label>Month <input id="summary-month" type="month" data-testid="summary-month" /></label>
      <form id="budget-form" data-testid="budget-form">
        <label>Budget total <input name="total" type="number" step="0.01" min="0.01" required data-testid="budget-total" /></label>
        <label>food <input name="food" type="number" step="0.01" min="0.01" data-testid="budget-cap-food" /></label>
        <label>transport <input name="transport" type="number" step="0.01" min="0.01" data-testid="budget-cap-transport" /></label>
        <label>bills <input name="bills" type="number" step="0.01" min="0.01" data-testid="budget-cap-bills" /></label>
        <label>fun <input name="fun" type="number" step="0.01" min="0.01" data-testid="budget-cap-fun" /></label>
        <button type="submit" data-testid="budget-save">Save</button>
        <p id="budget-source" data-testid="budget-source" hidden></p>
        <p id="budget-saved" data-testid="budget-saved" hidden></p>
        <p id="budget-error" class="error" data-testid="budget-error" hidden></p>
      </form>
      <p>Total: <strong id="summary-total" data-testid="summary-total"></strong></p>
      <p><a id="export-link" href="#" download data-testid="export-link">Export CSV</a></p>
      <ul id="summary-categories"></ul>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
